<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Civ Tapper</title>
</head>
<body onload="bodyLoaded()">

    <h1>Civ Tapper</h1>

    <table>
        <tr>
            <td><button onclick="incrementResource('foodCount', 1, 1)">Gather Food</button></td>
            <td><p>Food: <span id="foodCount">0</span></p></td>
        </tr>
        <tr>
            <td><button onclick="incrementResource('timberCount', 1, 1)">Gather Timber</button></td>
            <td><p>Timber: <span id="timberCount">0</span></p></td>
        </tr>
        <tr>
            <td><button onclick="incrementResource('stoneCount', 1, 1)">Gather Stone</button></td>
            <td><p>Stone: <span id="stoneCount">0</span></p></td>
        </tr>
        <tr>
            <td><button onclick= "addHouse()">Add House</button> </td>
            <td><p>Housing: <span id="housing">0</span></p></td>
            <td><span id="housingErrorMessage"></span></td>
        </tr>
    </tr>

    </table>
    
        


</body>
</html>
